name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Unlike pages.yml (a deploy, which must not be cancelled mid-flight), this
  # is pure CI — superseded runs on the same ref are safe to cancel.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json plugins/brainrot/.claude-plugin/plugin.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1])); print('ok', sys.argv[1])" "$f"
          done

      - name: Export script imports cleanly
        run: python3 -m py_compile plugins/brainrot/scripts/cc_history_export.py

  check:
    name: Check suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck zip

      - name: Run the check suite
        run: bash scripts/check.sh
